services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: examcraft-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examcraft-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - ENVIRONMENT=development
    depends_on:
      - qdrant

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examcraft-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  qdrant_storage:
